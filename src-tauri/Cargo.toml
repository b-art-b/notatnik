[package]
name = "notatnik-desktop"
description = "Notatnik desktop app (Tauri 2)"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notatnik-app = { path = "../crates/app" }
notatnik-graph = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
chrono = "0.4"

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
