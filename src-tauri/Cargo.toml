[package]
name = "notatnik-desktop"
description = "Notatnik desktop app (Tauri 2)"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notatnik-app = { path = "../crates/app" }
notatnik-graph = { workspace = true }
notatnik-log = { path = "../crates/log" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
chrono = "0.4"
log = "0.4"
tauri-plugin-dialog = "2"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.17"
base64 = "0.22"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
