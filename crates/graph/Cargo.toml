[package]
name = "notatnik-graph"
description = "Graph service: file I/O, atomic writes, file watching, conflict detection."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
notatnik-core.workspace = true
notatnik-index.workspace = true
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[lints]
workspace = true

[dev-dependencies]
chrono = "0.4.45"
criterion = "0.7.0"
tempfile = "3.27.0"

[[bench]]
name = "synthetic"
harness = false
