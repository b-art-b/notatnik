[package]
name = "notatnik-core"
description = "Pure logic: file format parser, block model, edit operations, page names, query language. No I/O; compiles to wasm32."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", optional = true }
unicode-normalization = "0.1.25"
yaml-rust2 = "0.13.0"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["json", "yaml"] }
proptest = "1.11.0"
rstest = "0.27.0"
serde_json = "1.0.151"

[features]
ts = ["dep:ts-rs"]
