[package]
name = "notatnik-index"
description = "SQLite index: schema, incremental indexing, full-text search, query compilation."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = "0.4.45"
notatnik-core.workspace = true
nucleo-matcher = "0.3.1"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["json", "yaml"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
