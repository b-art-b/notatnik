[package]
name = "notatnik-caldav"
description = "Calendar sync with a CalDAV server (Nextcloud): iCalendar tasks (VTODO), the client trait, an in-memory server for tests. No UI."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4.45"
quick-xml = "0.38"
serde = { version = "1.0.229", features = ["derive"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
notatnik-core = { workspace = true }
notatnik-sync = { workspace = true }
rrule = "0.14.0"
chrono-tz = "0.10.4"

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.49.0" }
