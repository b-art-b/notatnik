[package]
name = "notatnik-clip"
description = "Clips a web page into a one-chapter EPUB: fetch (with the limits of docs/phases/web-annotation.md), extract the article, clean it, store its pictures."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ammonia = "4"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
dom_query = "0.19"
dom_smoothie = "0.19"
encoding_rs = "0.8"
log = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
zip = { version = "2.4", default-features = false, features = ["deflate-miniz"] }

[lints]
workspace = true

[dev-dependencies]
quick-xml = "0.38"
