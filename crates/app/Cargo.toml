[package]
name = "notatnik-app"
description = "Application service shared by the desktop app and the dev server: typed API, page views, rendering, undo."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
notatnik-core = { workspace = true, features = ["ts"] }
notatnik-index = { workspace = true }
notatnik-crypt = { workspace = true }
notatnik-graph = { workspace = true }
notatnik-sync = { workspace = true }
notatnik-caldav = { path = "../caldav" }
base64 = "0.22"
log = "0.4"
chrono = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
notatnik-sync = { workspace = true, features = ["fakedav"] }

[lints]
workspace = true
