[package]
name = "notatnik-dev-server"
description = "HTTP wrapper around notatnik-app for running the UI in a normal browser (tests, development)."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "notatnik-dev-server"
path = "src/main.rs"

[dependencies]
notatnik-app = { path = "../app" }
notatnik-caldav = { path = "../caldav" }
notatnik-graph = { workspace = true }
notatnik-log = { path = "../log" }
chrono = "0.4"
log = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
