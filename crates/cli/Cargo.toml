[package]
name = "notatnik-cli"
description = "Command-line interface for indexing, searching and querying a graph."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "notatnik"
path = "src/main.rs"

[dependencies]
notatnik-core = { workspace = true }
notatnik-index = { workspace = true }
notatnik-graph = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
chrono = "0.4.45"
serde = "1.0.229"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2"
insta = "1.49.0"
serde_json = "1.0.151"
tempfile = "3"
