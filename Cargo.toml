[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
notatnik-core = { path = "crates/core" }
notatnik-crypt = { path = "crates/crypt" }
notatnik-index = { path = "crates/index" }
notatnik-graph = { path = "crates/graph" }
notatnik-sync = { path = "crates/sync" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Property tests run thousands of cases; a little optimisation keeps them fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Release builds (the .deb and the Android library) are small and fast, not quick to build: no debug info or symbols,
# one codegen unit, link-time optimisation, size over speed where it costs nothing visible.
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
